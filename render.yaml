services:
  - type: web
    name: alshatibi-web
    env: static
    region: frankfurt
    plan: free
    rootDir: customer-app
    buildCommand: npm install && npm run build
    staticPublishPath: ./dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://alshatibi-backend.onrender.com/api
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
